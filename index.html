<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sebuah surat untukmu</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#f6dfe8;--sky2:#d8cdee;--ink:#3a2a44;--soft:#7a6585;
  --paper:#fffaf7;--env:#ecc3d0;--env2:#e3b0c1;--flap:#f0cfda;
  --wax:#a3243b;--wax2:#6f1224;--petal:#e58fa8;--line:#e9d6df;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky1:#2a1738;--sky2:#120c24;--ink:#3a2a44;--soft:#7a6585;
    --paper:#f8eef2;--env:#c98fa6;--env2:#b87b93;--flap:#d6a0b5;--line:#e3cbd6;--petal:#e58fa8;
  }
}
:root[data-theme="dark"]{--sky1:#2a1738;--sky2:#120c24;--paper:#f8eef2;--env:#c98fa6;--env2:#b87b93;--flap:#d6a0b5;--line:#e3cbd6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  background:linear-gradient(170deg,var(--sky1),var(--sky2)) fixed;overflow-x:hidden}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petals i{position:absolute;top:-8vh;width:12px;height:16px;background:var(--petal);opacity:.55;
  border-radius:80% 0 80% 0;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx),112vh,0) rotate(540deg)}}

#stage{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:2rem 1.25rem;text-align:center}
#stage h1{font-weight:500;font-style:italic;font-size:clamp(1.6rem,6vw,2.4rem);margin:0;max-width:20ch;line-height:1.25;color:var(--paper);text-shadow:0 1px 12px rgba(60,20,60,.35)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #stage h1{color:var(--ink);text-shadow:none}}
:root[data-theme="light"] #stage h1{color:var(--ink);text-shadow:none}
#stage .hint{font-family:Caveat,"Comic Sans MS",cursive;font-size:1.35rem;color:var(--soft);margin:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #stage .hint{color:#cdb7d9}}

.wrap{perspective:900px;transition:transform 1s ease,opacity .8s ease}
.env{position:relative;width:min(320px,82vw);aspect-ratio:3/2;background:var(--env);border-radius:8px;box-shadow:0 18px 40px rgba(40,10,50,.35)}
.env .front{position:absolute;inset:0;background:var(--env2);border-radius:8px;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;background:var(--flap);transform-origin:top;
  clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .9s ease .15s,opacity .4s ease .7s;z-index:2;border-radius:8px 8px 0 0}
.seal{position:absolute;left:50%;top:62%;width:66px;height:66px;margin:-33px 0 0 -33px;z-index:3;border:0;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,var(--wax),var(--wax2));color:#f7c9d3;font-size:1.7rem;
  box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.12);transition:transform .25s ease,opacity .4s ease;animation:beat 2.4s ease-in-out infinite}
.seal:hover{transform:scale(1.08)}
.seal:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.opening .flap{transform:rotateX(180deg);opacity:0}
.opening .seal{opacity:0;animation:none;pointer-events:none}
.gone{transform:translateY(30vh);opacity:0;pointer-events:none}

#letter{position:relative;z-index:1;max-width:36rem;margin:0 auto;padding:3rem 1.25rem 5rem}
#letter[hidden]{display:none}
.sheet{background:var(--paper);border-radius:6px;padding:clamp(1.5rem,6vw,3rem);box-shadow:0 24px 50px rgba(40,10,50,.3);
  animation:unfold 1.1s ease both;transform-origin:top}
@keyframes unfold{from{opacity:0;transform:translateY(40px) scaleY(.92)}to{opacity:1;transform:none}}
.sheet h2{font-family:Caveat,"Comic Sans MS",cursive;font-weight:600;font-size:2.1rem;margin:0 0 1.2rem;color:var(--wax)}
.sheet h3{font-style:italic;font-weight:500;font-size:1.5rem;margin:2.4rem 0 .8rem;color:var(--wax)}
.sheet p{font-size:1.32rem;line-height:1.75;margin:0 0 1.1rem;white-space:pre-line}
.sheet ul{list-style:none;padding:0;margin:0}
.sheet li{position:relative;font-size:1.32rem;line-height:1.7;padding:.15rem 0 .15rem 1.7rem;margin-bottom:.5rem}
.sheet li::before{content:"♥";position:absolute;left:0;top:.2rem;color:var(--petal);font-size:1rem}
.sign{font-family:Caveat,"Comic Sans MS",cursive;font-size:1.9rem;text-align:right;margin:2rem 0 0;color:var(--wax)}
.ask{margin-top:2.6rem;padding-top:2rem;border-top:1px solid var(--line);text-align:center}
.ask p{font-style:italic;font-size:1.6rem;margin-bottom:1.4rem}
.btns{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}
.btn{font:inherit;font-size:1.2rem;padding:.75rem 1.4rem;border-radius:999px;cursor:pointer;border:1.5px solid var(--wax);background:transparent;color:var(--wax);transition:background .2s,color .2s}
.btn.main{background:var(--wax);color:#fff}
.btn:hover{background:var(--wax2);color:#fff;border-color:var(--wax2)}
#reply{min-height:3.5rem;margin-top:1.6rem;font-family:Caveat,"Comic Sans MS",cursive;font-size:1.7rem;line-height:1.35;color:var(--wax);white-space:pre-line}
.burst{position:fixed;z-index:5;pointer-events:none;color:var(--petal);animation:rise 1.8s ease-out forwards}
@keyframes rise{to{transform:translate(var(--bx),-70vh) scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .petals,.burst{display:none}.seal{animation:none}
  .sheet{animation:none}.wrap,.env .flap{transition:none}
}
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>

<section id="stage">
  <h1 id="judul"></h1>
  <div class="wrap" id="wrap">
    <div class="env" id="env">
      <div class="front"></div>
      <div class="flap"></div>
      <button class="seal" id="seal" aria-label="Buka surat">♥</button>
    </div>
  </div>
  <p class="hint" id="hint"></p>
</section>

<article id="letter" hidden>
  <div class="sheet" id="sheet"></div>
</article>

<script>
/* ============================================================
   ✏️ EDIT DI SINI SAJA — semua kata-kata ada di blok ini.
   Ganti teks di dalam tanda kutip. Tambah/kurangi baris sesuka kamu.
   ============================================================ */
const ISI = {
  judulAwal: "Ada yang ingin kusampaikan, dan aku tulis dengan sepenuh hati.",
  petunjuk: "Ketuk segelnya untuk membuka",
  sapaan: "Untuk Sayangku,",
  pembuka: [
    "Hai sayaang, aku mintaa maaf yaa atas kejadian hari inii 🥺 \n \nAku tahu aku salah besar bangett melakukan ituu, bener-bener salah dan aku nggak ada alasan buat ngebenarin diri aku sendiri. Aku tau kamuu overthinking bangett gara-gara aku, dan itu bikin aku nyesel banget.\n \nMaafin aku ya sayang, aku nggak bermaksud bikin kamu ngerasa nggak nyaman, ngerasa sedih, apalagi bikin kamu mikir yang macem-macem. Kamu itu berharga banget buat aku, dan terakhir yang aku mau adalah nyakitin kamu. \n \nAku janji bakal lebih hati-hati lagi, bakal lebih jaga sikap dan perasaan kamu. Jangan diem lama-lama ya sama aku, aku kangen kamu yang ceria. Peluk jauh dari aku yaa ♥️  \n \nAku sayang kamu banget.",
    "Hai sayaang, aku mintaa maaf yaa atas kejadian hari inii 🥺\n \nKalau diceritain dari sudut pandang kamu, aku bener-bener ngerti kenapa kamu bisa sesakit itu. Aku salah, tanpa pembelaan. Kamu nggak salah karena overthinking, kamu overthinking karena aku yang bikin kamu nggak ngerasa aman."
  ],
  judulSesal: "Yang aku sadari",
  sesal: [
    "Aku sesali karena aku egois, aku cuma mikirin perasaan aku sendiri tanpa mikirin gimana hati kamu waktu itu.",
    "Aku sadar sikap aku hari ini bener-bener nyakitin kamu, bikin kamu ngerasa nggak dihargai padahal kamu udah sayang banget sama aku.",
    "Aku sadar aku udah bikin orang yang paling aku sayang jadi nangis dan mikir macem-macem semalaman, dan itu yang paling bikin aku nyesel."
  ],
  judulJanji: "Yang ingin kulakukan mulai sekarang",
  janji: [
    "Aku janji akan lebih dengerin kamu dulu sebelum aku bereaksi, aku akan jaga ucapan dan tindakan aku biar kamu ngerasa aman lagi sama aku.",
    "Aku janji nggak akan ngulangin kesalahan yang sama, kalau aku bingung atau emosi aku bakal ngomong jujur ke kamu, bukan malah bikin kamu overthinking."
  ],
  penutup: "Sayang, makasih ya masih mau baca ini. Aku tau maaf aja nggak cukup, tapi aku bener-bener sayang sama kamu dan aku nggak mau kehilangan kamu cuma karena kebodohan aku hari ini. Boleh ya kita perbaikin sama-sama?\n \nPeluk jauh dari aku yang kangen banget sama kamu ♥️ ",
  tandaTangan: "Masa Depan Kamu [Angga]",
  pertanyaan: "Maukah kamu memaafkanku?",
  tombolYa: "Iya, aku maafin kamu",
  tombolNanti: "Aku butuh waktu dulu",
  balasYa: "Terima kasih ya. Aku akan buktikan lewat sikapku. Aku sayang kamu banget.",
  balasNanti: "Nggak apa-apa. Ambil waktu sebanyak yang kamu butuhkan.\nAku di sini, dan aku nggak akan memaksa."
};
/* ============================================================ */

const $ = id => document.getElementById(id);
$("judul").textContent = ISI.judulAwal;
$("hint").textContent = ISI.petunjuk;

// kelopak jatuh pelan
const pet = $("petals");
for (let i = 0; i < 16; i++) {
  const s = document.createElement("i");
  s.style.left = Math.random() * 100 + "%";
  s.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
  s.style.animationDuration = (11 + Math.random() * 12) + "s";
  s.style.animationDelay = (-Math.random() * 20) + "s";
  s.style.transform = "scale(" + (0.7 + Math.random() * 0.9) + ")";
  pet.appendChild(s);
}

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function daftar(arr) {
  const ul = document.createElement("ul");
  arr.forEach(t => ul.appendChild(el("li", t)));
  return ul;
}

function susunSurat() {
  const s = $("sheet");
  s.appendChild(el("h2", ISI.sapaan));
  ISI.pembuka.forEach(t => s.appendChild(el("p", t)));
  if (ISI.sesal.length) { s.appendChild(el("h3", ISI.judulSesal)); s.appendChild(daftar(ISI.sesal)); }
  if (ISI.janji.length) { s.appendChild(el("h3", ISI.judulJanji)); s.appendChild(daftar(ISI.janji)); }
  s.appendChild(el("p", ISI.penutup, "")).style.marginTop = "2rem";
  s.appendChild(el("p", ISI.tandaTangan, "sign"));

  const ask = el("div", null, "ask");
  ask.appendChild(el("p", ISI.pertanyaan));
  const b = el("div", null, "btns");
  const ya = el("button", ISI.tombolYa, "btn main");
  const nanti = el("button", ISI.tombolNanti, "btn");
  b.append(ya, nanti);
  const reply = el("div", null);
  reply.id = "reply";
  reply.setAttribute("aria-live", "polite");
  ask.append(b, reply);
  s.appendChild(ask);

  ya.onclick = () => { reply.textContent = ISI.balasYa; hati(); };
  nanti.onclick = () => { reply.textContent = ISI.balasNanti; };
}

function hati() {
  for (let i = 0; i < 22; i++) {
    const h = el("span", "♥", "burst");
    h.style.left = (20 + Math.random() * 60) + "vw";
    h.style.top = (60 + Math.random() * 30) + "vh";
    h.style.fontSize = (14 + Math.random() * 22) + "px";
    h.style.setProperty("--bx", (Math.random() * 120 - 60) + "px");
    h.style.animationDelay = (Math.random() * 0.5) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 2600);
  }
}

$("seal").onclick = () => {
  $("env").classList.add("opening");
  $("env").parentElement.classList.add("opening");
  setTimeout(() => $("wrap").classList.add("gone"), 1000);
  setTimeout(() => {
    $("stage").style.display = "none";
    susunSurat();
    $("letter").hidden = false;
    window.scrollTo(0, 0);
  }, 1700);
};
</script>
</body>
</html>
